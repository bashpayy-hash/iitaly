name: WhatsApp scaffold review
on:
  pull_request:
    paths:
      - 'integrations/whatsapp/**'
      - 'test/whatsapp/**'
      - '.github/workflows/whatsapp-review.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and offline tests (no secrets or dependencies)
        run: |
          set -o pipefail
          for f in integrations/whatsapp/*.js; do node --check "$f"; done
          node --test test/whatsapp/*.test.js | tee whatsapp-results.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-offline-tests
          path: whatsapp-results.tap
          retention-days: 7
